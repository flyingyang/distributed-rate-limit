name: distributed-rate-limit

x-redis: &redis
  image: redis:7.4.3-alpine
  command: sh /bootstrap/redis-node.sh
  volumes:
    - ./scripts/redis-node.sh:/bootstrap/redis-node.sh:ro
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 1s
    timeout: 1s
    retries: 30

x-sentinel: &sentinel
  image: redis:7.4.2-alpine
  command: sh /bootstrap/sentinel.sh
  depends_on:
    redis:
      condition: service_healthy
    redis-b:
      condition: service_healthy
    redis-c:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 1s
    timeout: 1s
    retries: 30

x-gateway: &gateway
  build:
    context: .
    dockerfile: Dockerfile.kong
  environment: &gateway-environment
    KONG_DATABASE: "off"
    KONG_DECLARATIVE_CONFIG: /config/kong.yaml
    KONG_PLUGINS: bundled,distributed-rate-limit
    KONG_ADMIN_LISTEN: "off"
    KONG_PROXY_LISTEN: 0.0.0.0:8000
    KONG_STATUS_LISTEN: 0.0.0.0:8100
    KONG_NGINX_WORKER_PROCESSES: "1"
    KONG_PROXY_ACCESS_LOG: /dev/stdout
    KONG_PROXY_ERROR_LOG: /dev/stderr
    KONG_TRUSTED_IPS: 172.30.85.10/32
    KONG_REAL_IP_HEADER: X-Forwarded-For
    KONG_REAL_IP_RECURSIVE: "on"
    KONG_DNS_ORDER: LAST,A,CNAME
  volumes:
    - ./config:/config:ro
  depends_on:
    publisher:
      condition: service_completed_successfully
    upstream:
      condition: service_started
  healthcheck:
    test: ["CMD", "kong", "health"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  redis:
    <<: *redis
    environment:
      REDIS_ANNOUNCE_IP: 172.30.85.20
    volumes:
      - redis-data:/data
      - ./scripts/redis-node.sh:/bootstrap/redis-node.sh:ro
    networks:
      default:
        ipv4_address: 172.30.85.20

  redis-b:
    <<: *redis
    environment:
      REDIS_ANNOUNCE_IP: 172.30.85.21
      REDIS_BOOTSTRAP_PRIMARY: redis
    volumes:
      - redis-b-data:/data
      - ./scripts/redis-node.sh:/bootstrap/redis-node.sh:ro
    networks:
      default:
        ipv4_address: 172.30.85.21

  redis-c:
    <<: *redis
    environment:
      REDIS_ANNOUNCE_IP: 172.30.85.22
      REDIS_BOOTSTRAP_PRIMARY: redis
    volumes:
      - redis-c-data:/data
      - ./scripts/redis-node.sh:/bootstrap/redis-node.sh:ro
    networks:
      default:
        ipv4_address: 172.30.85.22

  sentinel-a:
    <<: *sentinel
    environment:
      SENTINEL_ANNOUNCE_IP: 172.30.85.30
    volumes:
      - sentinel-a-data:/data
      - ./scripts/sentinel.sh:/bootstrap/sentinel.sh:ro
    networks:
      default:
        ipv4_address: 172.30.85.30

  sentinel-b:
    <<: *sentinel
    environment:
      SENTINEL_ANNOUNCE_IP: 172.30.85.31
    volumes:
      - sentinel-b-data:/data
      - ./scripts/sentinel.sh:/bootstrap/sentinel.sh:ro
    networks:
      default:
        ipv4_address: 172.30.85.31

  sentinel-c:
    <<: *sentinel
    environment:
      SENTINEL_ANNOUNCE_IP: 172.30.85.32
    volumes:
      - sentinel-c-data:/data
      - ./scripts/sentinel.sh:/bootstrap/sentinel.sh:ro
    networks:
      default:
        ipv4_address: 172.30.85.32

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    profiles: ["tools"]
    environment:
      REDIS_DATABASE: "15"
    volumes:
      - .:/workspace
    depends_on:
      sentinel-a:
        condition: service_healthy

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.tests
    volumes:
      - .:/workspace:ro
    command: python scripts/publish.py apply --wait
    depends_on:
      sentinel-a:
        condition: service_healthy

  upstream:
    image: python:3.12.10-slim
    working_dir: /workspace
    volumes:
      - ./scripts/upstream.py:/workspace/upstream.py:ro
    command: python -u upstream.py

  kong-a:
    <<: *gateway
    ports:
      - "127.0.0.1:8001:8000"

  kong-b:
    <<: *gateway
    ports:
      - "127.0.0.1:8002:8000"

  kong-c:
    <<: *gateway
    ports:
      - "127.0.0.1:8003:8000"

  proxy:
    image: nginx:1.27.5-alpine
    profiles: ["integration"]
    networks:
      default:
        ipv4_address: 172.30.85.10
    volumes:
      - ./config/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kong-a:
        condition: service_healthy
      kong-b:
        condition: service_healthy
      kong-c:
        condition: service_healthy

volumes:
  redis-data:
  redis-b-data:
  redis-c-data:
  sentinel-a-data:
  sentinel-b-data:
  sentinel-c-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.85.0/24
