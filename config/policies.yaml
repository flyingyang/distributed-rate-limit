namespace: demo
policies:
  - id: public-api
    rules:
      - id: orders-total
        limit_by: path
        path: /orders
        path_match: prefix
        limit: 12
        window_seconds: 3
      - id: client-total
        limit_by: consumer
        limit: 8
        window_seconds: 3
      - id: client-orders
        limit_by: consumer
        path: /orders
        path_match: prefix
        limit: 4
        window_seconds: 3
      - id: ip-total
        limit_by: ip
        limit: 20
        window_seconds: 3
  - id: isolated-api
    rules:
      - id: orders-total
        limit_by: path
        path: /isolated
        path_match: prefix
        limit: 3
        window_seconds: 3
  - id: identity-api
    rules:
      - id: private-client
        limit_by: consumer
        path: /private
        path_match: prefix
        limit: 2
        window_seconds: 3
  - id: ip-api
    rules:
      - id: ip-total
        limit_by: ip
        limit: 2
        window_seconds: 3
