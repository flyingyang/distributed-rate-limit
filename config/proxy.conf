upstream gateways {
    server kong-a:8000;
    server kong-b:8000;
    server kong-c:8000;
}

server {
    listen 8080;
    location / {
        proxy_pass http://gateways;
        # This controlled proxy discards client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
